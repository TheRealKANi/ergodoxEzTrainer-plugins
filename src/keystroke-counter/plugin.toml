# A small overlay: counts the keys you were asked to press and shows the number in a corner.
# Also the test plugin for this repository: add the repo, trust the key, install it.

[plugin]
id = "keystroke-counter"
name = "Keystroke counter"
version = "1.0.0"
api = "0"
provides = ["overlay"]
description = "Counts the keys you were asked to press in this session."
author = "TheRealKANi"
homepage = "https://github.com/TheRealKANi/ergodoxEzTrainer-plugins"
license = "GPL-3.0-or-later"
icon = "star"
entry = "main.rhai"
layer = 50

[[setting]]
key = "show"
type = "bool"
default = true
label = "Show the counter"

[[setting]]
key = "corner"
type = "choice"
default = "right"
label = "Corner"
options = [
  { value = "left", label = "Top left" },
  { value = "right", label = "Top right" },
]
